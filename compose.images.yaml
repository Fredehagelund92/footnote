# The demo from the published images, instead of building them on this computer (README, "Quick
# start"). Everything else comes from compose.yaml:
#
#   docker compose -f compose.yaml -f compose.images.yaml up
#
# This runs the release named below, which can be behind this checkout. To run the code you have
# here, use docker compose up. The release pull request writes the version on each marked line
# (release-please-config.json), so at a release's tag this file names that release's images.

services:
  heed:
    image: ghcr.io/fredehagelund92/heed:0.1.0 # x-release-please-version
  web:
    image: ghcr.io/fredehagelund92/heed-web:0.1.0 # x-release-please-version
