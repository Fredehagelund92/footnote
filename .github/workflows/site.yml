name: Site

# The release's copy of the public site (site/README.md), for a team without internet access:
# footnote-docs-<version>.tar.gz, the landing page and that release's docs, built at its tag to be
# served at the root of any host. release.yml calls this and attaches the tarball.
#
# Publishing is not done here: Vercel builds and serves the site from the repository
# (site/vercel.json, docs/releasing.md "The site"). Pull requests check the site in CI (ci.yml, the
# site job).
on:
  workflow_call:
    inputs:
      version:
        description: The release, MAJOR.MINOR.PATCH. The tag being built must name it.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the release's copy of the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Build the site at the root of any host, with links at the tag
        working-directory: site
        env:
          DOCS_REF: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          npm run build
          tar -czf "$RUNNER_TEMP/footnote-docs-$VERSION.tar.gz" --transform "s,^dist,footnote-docs-$VERSION," dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-tarball
          path: ${{ runner.temp }}/footnote-docs-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 1
