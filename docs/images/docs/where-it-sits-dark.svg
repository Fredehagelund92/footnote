<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Where it sits</title>
  <desc id="desc">Cube or dbt define the metrics and dimensions, and Footnote reads their names. Documents in Google Drive or Git become suggestions for their owners. Footnote holds context items, each with an owner and a check date, and the names, but no data rows. Agents ask over MCP and read what applies; people write, check and ask in the web app.</desc>
  <style>
    .bg { fill: #0f1011; }
    .box { fill: #151617; stroke: #2e2f31; stroke-width: 1.5; }
    .key { fill: #1b2230; stroke: #7aa2f0; stroke-width: 1.5; }
    .ok { fill: #14241d; stroke: #4cc38a; stroke-width: 1.5; }
    .warn { fill: #0f1011; stroke: #82878f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: #82878f; stroke-width: 1.5; }
    .back { fill: none; stroke: #82878f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #82878f; }
    .headwarn { fill: #82878f; }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f7f8f8; }
    .t { font-size: 18px; font-weight: 600; }
    .s { font-size: 15.5px; fill: #d0d6e0; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14.5px; fill: #d0d6e0; }
    .l { font-size: 14.5px; fill: #8a8f98; }
    .lw { font-size: 14.5px; fill: #8a8f98; }
    .okt { fill: #4cc38a; font-weight: 600; font-size: 13px; }
  </style>
  <rect class="bg" width="960" height="360"/>
<rect class="box" x="24" y="30" width="236" height="116" rx="10"/>
<text class="t" x="40" y="61">Cube or dbt</text>
<text class="s" x="40" y="86">define the metrics and</text>
<text class="s" x="40" y="108">dimensions</text>
<rect class="box" x="24" y="214" width="236" height="116" rx="10"/>
<text class="t" x="40" y="245">Google Drive or Git</text>
<text class="s" x="40" y="270">hold your documents</text>
<rect class="key" x="354" y="30" width="252" height="300" rx="10"/>
<text class="t" x="370" y="61">Footnote</text>
<text class="s" x="370" y="86">Context items, each with</text>
<text class="s" x="370" y="108">an owner and a check date</text>
<text class="s" x="370" y="130"></text>
<text class="s" x="370" y="152">The names of metrics and</text>
<text class="s" x="370" y="174">dimensions, read from</text>
<text class="s" x="370" y="196">your definitions</text>
<text class="s" x="370" y="218"></text>
<text class="s" x="370" y="240">No data rows</text>
<rect class="box" x="700" y="30" width="236" height="116" rx="10"/>
<text class="t" x="716" y="61">Agents</text>
<text class="s" x="716" y="86">ask over MCP and read</text>
<text class="s" x="716" y="108">what applies</text>
<rect class="box" x="700" y="214" width="236" height="116" rx="10"/>
<text class="t" x="716" y="245">People</text>
<text class="s" x="716" y="270">write, check and ask</text>
<text class="s" x="716" y="292">in the web app</text>
<path class="line" d="M260 85 L343.0 85.0"/><path class="head" d="M352 85 L343.0 80.0 L343.0 90.0 Z"/>
<text class="l" x="306" y="72" text-anchor="middle">names</text>
<path class="line" d="M260 272 L343.0 272.0"/><path class="head" d="M352 272 L343.0 267.0 L343.0 277.0 Z"/>
<text class="l" x="306" y="258" text-anchor="middle">suggestions</text>
<path class="line" d="M698 85 L617.0 85.0"/><path class="head" d="M608 85 L617.0 90.0 L617.0 80.0 Z"/>
<path class="line" d="M608 100 L689.0 100.0"/><path class="head" d="M698 100 L689.0 95.0 L689.0 105.0 Z"/>
<text class="l" x="653" y="72" text-anchor="middle">asks</text>
<text class="l" x="653" y="120" text-anchor="middle">reads</text>
<path class="line" d="M698 265 L617.0 265.0"/><path class="head" d="M608 265 L617.0 270.0 L617.0 260.0 Z"/>
<path class="line" d="M608 280 L689.0 280.0"/><path class="head" d="M698 280 L689.0 275.0 L689.0 285.0 Z"/>
<text class="l" x="653" y="252" text-anchor="middle">writes</text>
<text class="l" x="653" y="300" text-anchor="middle">reads</text>
</svg>
