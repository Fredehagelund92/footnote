# Footnote on this computer: PostgreSQL 18, the service and the web app (README, "Quick start").
#
#   docker compose up       then open http://localhost:8080
#
# A new database gets the demo (SEED_DEMO=on): invented people, domains and facts about the demo
# Cube model, which the image carries (db/seed/cube), so nothing is read from this computer. To run
# on your own Cube model instead, name its folder in CUBE_MODEL_DIR (README, "Use your own data");
# it is shared into the container read only, and the demo is then left out. FOOTNOTE_WEB_PORT and
# FOOTNOTE_PORT move the web app (8080) and the service (3000). Both listen on this computer only:
# anyone who reaches them can sign in as any of the demo people.
#
# Ask and the test runs answer on scripted models and send nothing out. MODELS=live with a key
# answers on a real model (docs/self-hosting.md, "Ask on a real model"):
#
#   MODELS=live ANTHROPIC_API_KEY=... docker compose up
#
# Not for production: the database trusts every connection inside this network, and sign-in is
# the demo's people picker.

name: footnote

services:
  db:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 30

  footnote:
    build:
      context: .
      target: service
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The demo: the people picker, the demo data and agents that sign in on this computer. The
      # image alone starts in production mode, which needs company sign-in (docs/operations.md).
      NODE_ENV: development
      # The web container's nginx forwards the address of each browser that calls /api/v1, so the
      # request limits count each caller on its own. Believed only from this network's private
      # addresses, where that nginx is.
      FOOTNOTE_TRUSTED_PROXIES: uniquelocal
      # The superuser makes Footnote's roles and database and loads the demo; each part of the service
      # then connects as its own role (db/README.md).
      DATABASE_URL_BOOTSTRAP: postgres://postgres@db:5432/postgres
      DATABASE_URL_MIGRATE: postgres://context_layer_owner@db:5432/footnote
      DATABASE_URL: postgres://context_layer_api@db:5432/footnote
      SEED_DEMO: ${SEED_DEMO:-on}
      # Your own model's folder, when you name one; empty, the image reads its demo model.
      CUBE_MODEL_DIR: ${CUBE_MODEL_DIR:+/cube-model}
      FOOTNOTE_WEB_ORIGINS: http://localhost:${FOOTNOTE_WEB_PORT:-8080}
      MCP_RESOURCE_URL: http://localhost:${FOOTNOTE_PORT:-3000}/mcp
      # The secret store: the tokens and signed links of the tools you connect, in a folder of its
      # own in the keys volume, so they stay when the container is made again. The service makes
      # it, for its own user alone: it refuses a folder others may read, as the volume's top is.
      FOOTNOTE_SECRETS_DIR: /var/lib/footnote/secrets
      # The models, and the key and address of each provider, from this computer's shell when it
      # sets them; unset, the scripted models (docs/configuration.md, "Models"). No default is
      # written: the provider packages fail on an empty address, so an unset one must stay unset.
      MODELS:
      ANTHROPIC_API_KEY:
      ANTHROPIC_BASE_URL:
      VERCEL_AI_GATEWAY_API_KEY:
      VERCEL_AI_GATEWAY_BASE_URL:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
    volumes:
      # Your own model's folder, or an empty volume nothing reads when you name none: the demo
      # never depends on a folder Docker shares from this computer.
      - ${CUBE_MODEL_DIR:-no-model}:/cube-model:ro
      - keys:/var/lib/footnote
    ports:
      - 127.0.0.1:${FOOTNOTE_PORT:-3000}:3000

  web:
    build:
      context: .
      target: web
    depends_on:
      footnote:
        condition: service_healthy
    ports:
      - 127.0.0.1:${FOOTNOTE_WEB_PORT:-8080}:8080

volumes:
  db:
  keys:
  no-model:
